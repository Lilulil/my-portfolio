<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Edge AI motion pipeline: webcam to getUserMedia to MediaPipe Pose Landmarker to kinematic classifier to CodeIgniter 4 view and telemetry">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b141c"/><stop offset="1" stop-color="#0e1a24"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37c8ff"/><stop offset="1" stop-color="#5fe08a"/></linearGradient>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#37c8ff"/></marker>
    <marker id="amg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fe08a"/></marker>
  </defs>

  <rect width="1200" height="420" rx="14" fill="url(#bgm)"/>
  <rect width="1200" height="4" fill="url(#acc)"/>

  <!-- client zone -->
  <rect x="26" y="52" width="770" height="330" rx="10" fill="none" stroke="#26404f" stroke-dasharray="7 6"/>
  <text x="42" y="76" font-size="13" fill="#5d7f96" font-family="DejaVu Sans Mono, monospace">BROWSER / EDGE CLIENT — inference local, zero streaming</text>

  <!-- server zone -->
  <rect x="826" y="52" width="348" height="330" rx="10" fill="none" stroke="#26404f" stroke-dasharray="7 6"/>
  <text x="842" y="76" font-size="13" fill="#5d7f96" font-family="DejaVu Sans Mono, monospace">SERVER — metadata only</text>

  <!-- node 1 -->
  <g font-family="DejaVu Sans, Arial">
    <rect x="46" y="104" width="164" height="86" rx="10" fill="#12212e" stroke="#2f5d7a"/>
    <text x="64" y="134" font-size="15" font-weight="700" fill="#e6f2fa">Laptop webcam</text>
    <text x="64" y="156" font-size="12" fill="#7d9cb1">720p · 30–60 fps</text>
    <text x="64" y="174" font-size="12" fill="#7d9cb1">raw frames</text>

    <!-- node 2 -->
    <rect x="240" y="104" width="176" height="86" rx="10" fill="#12212e" stroke="#2f5d7a"/>
    <text x="258" y="134" font-size="15" font-weight="700" fill="#e6f2fa">getUserMedia()</text>
    <text x="258" y="156" font-size="12" fill="#7d9cb1">HTML5 MediaStream</text>
    <text x="258" y="174" font-size="12" fill="#7d9cb1">no upload</text>

    <!-- node 3 -->
    <rect x="446" y="104" width="330" height="86" rx="10" fill="#0f2a1f" stroke="#2e7f5c"/>
    <text x="464" y="134" font-size="15" font-weight="700" fill="#a9f0c6">Pose Landmarker · JS / WASM</text>
    <text x="464" y="156" font-size="12" fill="#6fbf95">33 landmarks 3D · GPU delegate</text>
    <text x="464" y="174" font-size="12" fill="#6fbf95">12–22 ms per frame · 30+ fps</text>

    <!-- node 4 -->
    <rect x="240" y="252" width="236" height="92" rx="10" fill="#1b1626" stroke="#6b4ea8"/>
    <text x="258" y="282" font-size="15" font-weight="700" fill="#e6d9ff">Kinematic classifier</text>
    <text x="258" y="304" font-size="12" fill="#a48fce">FIFO moving average 5–10 f</text>
    <text x="258" y="322" font-size="12" fill="#a48fce">debounce 300 ms · hysteresis</text>

    <!-- node 5 -->
    <rect x="516" y="252" width="260" height="92" rx="10" fill="#12212e" stroke="#2f5d7a"/>
    <text x="534" y="282" font-size="15" font-weight="700" fill="#e6f2fa">UI state overlay</text>
    <text x="534" y="304" font-size="12" fill="#7d9cb1">JUMP · CROUCH · KICK ·</text>
    <text x="534" y="322" font-size="12" fill="#7d9cb1">LYING DOWN · NO MOVEMENT</text>

    <!-- arrows -->
    <line x1="210" y1="147" x2="236" y2="147" stroke="#37c8ff" stroke-width="2" marker-end="url(#am)"/>
    <line x1="416" y1="147" x2="442" y2="147" stroke="#37c8ff" stroke-width="2" marker-end="url(#am)"/>
    <path d="M611 190 L611 218 L358 218 L358 248" fill="none" stroke="#37c8ff" stroke-width="2" marker-end="url(#am)"/>
    <line x1="476" y1="298" x2="512" y2="298" stroke="#37c8ff" stroke-width="2" marker-end="url(#am)"/>

    <!-- server nodes -->
    <rect x="850" y="104" width="300" height="86" rx="10" fill="#101d17" stroke="#2e7f5c"/>
    <text x="868" y="134" font-size="15" font-weight="700" fill="#a9f0c6">CodeIgniter 4 view</text>
    <text x="868" y="156" font-size="12" fill="#6fbf95">controller renders wrapper</text>
    <text x="868" y="174" font-size="12" fill="#6fbf95">no frame proxying</text>

    <rect x="850" y="252" width="300" height="92" rx="10" fill="#1a1a12" stroke="#7a6a2e"/>
    <text x="868" y="282" font-size="15" font-weight="700" fill="#f2e2a8">Telemetry REST / WS</text>
    <text x="868" y="304" font-size="12" fill="#bfae72">state · confidence · timestamp</text>
    <text x="868" y="322" font-size="12" fill="#bfae72">≈120 B per event · 0 KB video</text>

    <!-- links to server -->
    <path d="M646 147 L846 147" fill="none" stroke="#37c8ff" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#am)"/>
    <path d="M646 298 L846 298" fill="none" stroke="#5fe08a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#amg)"/>
    <text x="700" y="132" font-size="11" fill="#4a7a92" font-family="DejaVu Sans Mono, monospace">page load</text>
    <text x="700" y="316" font-size="11" fill="#4a8a6a" font-family="DejaVu Sans Mono, monospace">event push</text>
  </g>
</svg>
