<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Automation bot dashboard: 24 hour cycle chart with zero failed batches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1410"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f7a4d"/><stop offset="1" stop-color="#5fe08a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fe08a"/><stop offset="1" stop-color="#37c8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="799" height="449" rx="14" fill="none" stroke="#1e2b25"/>
  <!-- window bar -->
  <circle cx="26" cy="26" r="5" fill="#ff5f56"/><circle cx="44" cy="26" r="5" fill="#ffbd2e"/><circle cx="62" cy="26" r="5" fill="#27c93f"/>
  <text x="92" y="31" fill="#7d8c85" font-family="monospace" font-size="13">farm-bot · scheduler</text>
  <rect x="640" y="16" width="140" height="22" rx="11" fill="#12261a" stroke="#2a4a38"/>
  <circle cx="656" cy="27" r="4" fill="#5fe08a"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="668" y="31" fill="#8fe388" font-family="monospace" font-size="11">RUNNING</text>

  <!-- KPI row -->
  <g font-family="monospace">
    <text x="34" y="82" fill="#66756e" font-size="11">CYCLES / 24H</text>
    <text x="34" y="114" fill="#e8f5ee" font-size="30" font-weight="bold">112</text>
    <text x="210" y="82" fill="#66756e" font-size="11">FAILED BATCHES</text>
    <text x="210" y="114" fill="#5fe08a" font-size="30" font-weight="bold">0</text>
    <text x="386" y="82" fill="#66756e" font-size="11">ACTIONS SENT</text>
    <text x="386" y="114" fill="#e8f5ee" font-size="30" font-weight="bold">1 274</text>
    <text x="562" y="82" fill="#66756e" font-size="11">UPTIME</text>
    <text x="562" y="114" fill="#e8f5ee" font-size="30" font-weight="bold">99.4%</text>
  </g>

  <!-- chart -->
  <g>
    <line x1="34" y1="330" x2="766" y2="330" stroke="#22322b"/>
    <line x1="34" y1="270" x2="766" y2="270" stroke="#182620"/>
    <line x1="34" y1="210" x2="766" y2="210" stroke="#182620"/>
    <line x1="34" y1="150" x2="766" y2="150" stroke="#182620"/>
    <g fill="url(#bar)">
      <rect x="42" y="286" width="18" height="44" rx="3"/><rect x="72" y="262" width="18" height="68" rx="3"/>
      <rect x="102" y="244" width="18" height="86" rx="3"/><rect x="132" y="252" width="18" height="78" rx="3"/>
      <rect x="162" y="226" width="18" height="104" rx="3"/><rect x="192" y="238" width="18" height="92" rx="3"/>
      <rect x="222" y="214" width="18" height="116" rx="3"/><rect x="252" y="230" width="18" height="100" rx="3"/>
      <rect x="282" y="196" width="18" height="134" rx="3"/><rect x="312" y="208" width="18" height="122" rx="3"/>
      <rect x="342" y="184" width="18" height="146" rx="3"/><rect x="372" y="198" width="18" height="132" rx="3"/>
      <rect x="402" y="172" width="18" height="158" rx="3"/><rect x="432" y="190" width="18" height="140" rx="3"/>
      <rect x="462" y="164" width="18" height="166" rx="3"/><rect x="492" y="178" width="18" height="152" rx="3"/>
      <rect x="522" y="156" width="18" height="174" rx="3"/><rect x="552" y="170" width="18" height="160" rx="3"/>
      <rect x="582" y="148" width="18" height="182" rx="3"/><rect x="612" y="162" width="18" height="168" rx="3"/>
      <rect x="642" y="142" width="18" height="188" rx="3"/><rect x="672" y="154" width="18" height="176" rx="3"/>
      <rect x="702" y="138" width="18" height="192" rx="3"/><rect x="732" y="150" width="18" height="180" rx="3"/>
    </g>
    <text x="34" y="352" fill="#66756e" font-family="monospace" font-size="10">00:00</text>
    <text x="700" y="352" fill="#66756e" font-family="monospace" font-size="10">24:00</text>
  </g>

  <!-- log lines -->
  <g font-family="monospace" font-size="11">
    <rect x="34" y="372" width="732" height="58" rx="8" fill="#08120e" stroke="#1a2a22"/>
    <text x="48" y="392" fill="#4f7a63">[12:45:02]</text><text x="126" y="392" fill="#9fb3a9">harvest 7 · plant 7 · water 6 · sell 15</text><text x="690" y="392" fill="#5fe08a">ok</text>
    <text x="48" y="412" fill="#4f7a63">[13:00:01]</text><text x="126" y="412" fill="#9fb3a9">auto-upgrade skipped (materials 7/8)</text><text x="690" y="412" fill="#8a8a8a">skip</text>
  </g>
  <rect x="0" y="0" width="800" height="3" fill="url(#accent)" opacity="0.7"/>
</svg>
