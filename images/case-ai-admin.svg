  </defs>
  <rect width="800" height="450" rx="14" fill="url(#bg4)"/>
  <rect x="0.5" y="0.5" width="799" height="449" rx="14" fill="none" stroke="#17303f"/>
  <circle cx="26" cy="26" r="5" fill="#ff5f56"/><circle cx="44" cy="26" r="5" fill="#ffbd2e"/><circle cx="62" cy="26" r="5" fill="#27c93f"/>
