  <text x="116" y="174" fill="#a9f0c6" font-family="sans-serif" font-size="11">Ongkir Jateng Rp 12.000.</text>

  <rect x="40" y="194" width="252" height="34" rx="10" fill="#1c2f3d"/>
  <text x="52" y="216" fill="#cfe3ee" font-family="sans-serif" font-size="11">mau pesan 2, nama Rina, Jl. Perbalan</text>

  <rect x="104" y="236" width="204" height="66" rx="10" fill="#123c2c"/>
