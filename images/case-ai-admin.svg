  <text x="116" y="273" fill="#8fe3b4" font-family="monospace" font-size="10">Hitam / L x2 · Rp 158.000</text>
  <text x="116" y="290" fill="#8fe3b4" font-family="monospace" font-size="10">COD · Rina</text>

