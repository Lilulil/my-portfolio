  <text x="402" y="246" fill="#3f8f6b" font-family="monospace" font-size="10">WHATSAPP · konfirmasi ke pelanggan</text>
  <rect x="402" y="258" width="300" height="72" rx="10" fill="#123c2c"/>
  <text x="414" y="278" fill="#a9f0c6" font-family="sans-serif" font-size="11">Siap kak, pesanannya sudah dicatat 📝</text>
