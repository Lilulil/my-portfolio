  <text x="402" y="352" fill="#4d7d99" font-family="monospace" font-size="10">delivered via gateway · 62895414186600</text>
  <text x="402" y="372" fill="#4d7d99" font-family="monospace" font-size="10">follow-up H+1 / H+3 otomatis</text>

  <rect x="0" y="0" width="800" height="3" fill="url(#accent4)" opacity="0.8"/>
