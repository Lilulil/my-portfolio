    <text x="410" y="126" fill="#cfe8dc">07:41    Rina   Kaos Basic   Hitam / L  2   Rp 158.000</text>
    <text x="410" y="146" fill="#6f8f82">07:52    Budi   Hijab Pashmina Mocca     1   Rp 65.000</text>
    <text x="410" y="166" fill="#6f8f82">08:03    Sari   Kaos Oversize Krem / XL  1   Rp 99.000</text>
