  <text x="40" y="364" fill="#4d7d99" font-family="monospace" font-size="10">answered in 1.4s · 24/7</text>

  <!-- arrow -->
  <line x1="332" y1="150" x2="378" y2="150" stroke="#3f6f8a" stroke-width="2" marker-end="url(#ar4)"/>
  <line x1="332" y1="270" x2="378" y2="270" stroke="#3f6f8a" stroke-width="2" marker-end="url(#ar4)"/>

